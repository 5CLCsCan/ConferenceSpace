name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  validate-frontend:
    name: Validate frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  validate-backend:
    name: Validate backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Generate Swagger docs
        run: go run github.com/swaggo/swag/cmd/swag@latest init -g cmd/server/main.go -o ./docs

      - name: Test
        run: go test $(go list ./... | grep -v '/tests/api')

  validate-ai-service:
    name: Validate AI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==1.8.5

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Test
        run: poetry run pytest -k "not submission_gating"

  build-images:
    name: Build and push images
    runs-on: ubuntu-latest
    needs:
      - validate-frontend
      - validate-backend
      - validate-ai-service
    outputs:
      frontend-image: ${{ steps.images.outputs.frontend }}
      backend-image: ${{ steps.images.outputs.backend }}
      ai-service-image: ${{ steps.images.outputs.ai-service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: images
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conferencespace"
          echo "prefix=${image_prefix}" >> "$GITHUB_OUTPUT"
          echo "frontend=${image_prefix}-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend=${image_prefix}-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "ai-service=${image_prefix}-ai-service:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.PUBLIC_API_BASE_URL || '/api/backend' }}
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}
            ${{ steps.images.outputs.prefix }}-frontend:latest

      - name: Build and push backend
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}
            ${{ steps.images.outputs.prefix }}-backend:latest

      - name: Build and push AI service
        id: build-ai-service
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.ai-service }}
            ${{ steps.images.outputs.prefix }}-ai-service:latest

      - name: Print image digests
        run: |
          {
            echo "## Image digests"
            echo
            echo "| Service | Image | Digest |"
            echo "| --- | --- | --- |"
            echo "| frontend | \`${{ steps.images.outputs.frontend }}\` | \`${{ steps.build-frontend.outputs.digest }}\` |"
            echo "| backend | \`${{ steps.images.outputs.backend }}\` | \`${{ steps.build-backend.outputs.digest }}\` |"
            echo "| ai-service | \`${{ steps.images.outputs.ai-service }}\` | \`${{ steps.build-ai-service.outputs.digest }}\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-images
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          cp deployment/docker-compose.prod.yml deploy/docker-compose.prod.yml
          cp deployment/Caddyfile deploy/Caddyfile
          cp deployment/bootstrap.sh deploy/bootstrap.sh

      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/Caddyfile,deploy/bootstrap.sh
          target: /opt/conferencespace
          strip_components: 1

      - name: Deploy stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          FRONTEND_IMAGE: ${{ needs.build-images.outputs.frontend-image }}
          BACKEND_IMAGE: ${{ needs.build-images.outputs.backend-image }}
          AI_SERVICE_IMAGE: ${{ needs.build-images.outputs.ai-service-image }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT || '3000' }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || '/api/backend' }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          AGENT_SERVICE_TOKEN: ${{ secrets.AGENT_SERVICE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-1.5-pro' }}
          GEMINI_ENABLED: ${{ vars.GEMINI_ENABLED || 'true' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || 'openrouter/google/gemini-2.5-flash-lite' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || '' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || '' }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_FROM_EMAIL: ${{ vars.BREVO_FROM_EMAIL || 'noreply@conferencespace.io' }}
          BREVO_FROM_NAME: ${{ vars.BREVO_FROM_NAME || 'ConferenceSpace' }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || format('http://{0}:{1}', secrets.DEPLOY_HOST, vars.FRONTEND_PORT || '3000') }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: FRONTEND_IMAGE,BACKEND_IMAGE,AI_SERVICE_IMAGE,FRONTEND_PORT,PUBLIC_API_BASE_URL,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,NEO4J_USERNAME,NEO4J_PASSWORD,JWT_SECRET,ADMIN_TOKEN,AGENT_SERVICE_TOKEN,GEMINI_API_KEY,GEMINI_MODEL,GEMINI_ENABLED,OPENROUTER_API_KEY,AGENT_MODEL,OPENAI_API_KEY,OPENAI_BASE_URL,OPENAI_MODEL,SEMANTIC_SCHOLAR_API_KEY,BREVO_API_KEY,BREVO_FROM_EMAIL,BREVO_FROM_NAME,APP_BASE_URL,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            cd /opt/conferencespace

            umask 077
            cat > .env.production <<EOF
            FRONTEND_IMAGE=${FRONTEND_IMAGE}
            BACKEND_IMAGE=${BACKEND_IMAGE}
            AI_SERVICE_IMAGE=${AI_SERVICE_IMAGE}
            FRONTEND_PORT=${FRONTEND_PORT}
            PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL}

            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}

            NEO4J_USERNAME=${NEO4J_USERNAME}
            NEO4J_PASSWORD=${NEO4J_PASSWORD}

            SERVER_ENV=production
            JWT_SECRET=${JWT_SECRET}
            ADMIN_TOKEN=${ADMIN_TOKEN}
            AGENT_SERVICE_TOKEN=${AGENT_SERVICE_TOKEN}
            APP_BASE_URL=${APP_BASE_URL}

            GEMINI_API_KEY=${GEMINI_API_KEY}
            GEMINI_MODEL=${GEMINI_MODEL}
            GEMINI_ENABLED=${GEMINI_ENABLED}

            OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
            AGENT_MODEL=${AGENT_MODEL}
            OPENAI_API_KEY=${OPENAI_API_KEY}
            OPENAI_BASE_URL=${OPENAI_BASE_URL}
            OPENAI_MODEL=${OPENAI_MODEL}

            SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY}
            BREVO_API_KEY=${BREVO_API_KEY}
            BREVO_FROM_EMAIL=${BREVO_FROM_EMAIL}
            BREVO_FROM_NAME=${BREVO_FROM_NAME}

            FILE_STORAGE_PROVIDER=local
            FILE_STORAGE_LOCAL_BASE_PATH=/data/uploads/submissions
            AI_SERVICE_BASE_URL=http://ai-service:8090
            AI_SERVICE_TIMEOUT_SECONDS=180
            BACKEND_API_BASE_URL=http://backend:8080
            REDIS_URL=redis://redis:6379/0
            EOF

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm backend-migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps
