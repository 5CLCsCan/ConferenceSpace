name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  validate-frontend:
    name: Validate frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  validate-backend:
    name: Validate backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Generate Swagger docs
        run: go run github.com/swaggo/swag/cmd/swag@latest init -g cmd/server/main.go -o ./docs

      - name: Test
        run: go test $(go list ./... | grep -v '/tests/api')

  validate-ai-service:
    name: Validate AI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==1.8.5

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Test
        run: poetry run pytest -k "not submission_gating"

  build-frontend-image:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    needs: validate-frontend
    environment: production
    outputs:
      image: ${{ steps.images.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image names
        id: images
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conferencespace"
          echo "prefix=${image_prefix}" >> "$GITHUB_OUTPUT"
          echo "image=${image_prefix}-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/backend
          push: true
          tags: |
            ${{ steps.images.outputs.image }}
            ${{ steps.images.outputs.prefix }}-frontend:latest

  build-backend-image:
    name: Build and push backend image
    runs-on: ubuntu-latest
    needs: validate-backend
    environment: production
    outputs:
      image: ${{ steps.images.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image names
        id: images
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conferencespace"
          echo "prefix=${image_prefix}" >> "$GITHUB_OUTPUT"
          echo "image=${image_prefix}-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.image }}
            ${{ steps.images.outputs.prefix }}-backend:latest

  build-ai-service-image:
    name: Build and push AI service image
    runs-on: ubuntu-latest
    needs: validate-ai-service
    environment: production
    outputs:
      image: ${{ steps.images.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image names
        id: images
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conferencespace"
          echo "prefix=${image_prefix}" >> "$GITHUB_OUTPUT"
          echo "image=${image_prefix}-ai-service:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push AI service
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.image }}
            ${{ steps.images.outputs.prefix }}-ai-service:latest

  summarize-images:
    name: Summarize image digests
    runs-on: ubuntu-latest
    needs:
      - build-frontend-image
      - build-backend-image
      - build-ai-service-image
    steps:
      - name: Print image digests
        run: |
          {
            echo "## Image digests"
            echo
            echo "| Service | Image | Digest |"
            echo "| --- | --- | --- |"
            echo "| frontend | \`${{ needs.build-frontend-image.outputs.image }}\` | \`${{ needs.build-frontend-image.outputs.digest }}\` |"
            echo "| backend | \`${{ needs.build-backend-image.outputs.image }}\` | \`${{ needs.build-backend-image.outputs.digest }}\` |"
            echo "| ai-service | \`${{ needs.build-ai-service-image.outputs.image }}\` | \`${{ needs.build-ai-service-image.outputs.digest }}\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs:
      - build-frontend-image
      - build-backend-image
      - build-ai-service-image
      - summarize-images
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          cp deployment/docker-compose.prod.yml deploy/docker-compose.prod.yml
          cp deployment/Caddyfile deploy/Caddyfile
          cp deployment/bootstrap.sh deploy/bootstrap.sh

      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/Caddyfile,deploy/bootstrap.sh
          target: /opt/conferencespace
          strip_components: 1

      - name: Deploy stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          FRONTEND_IMAGE: ${{ needs.build-frontend-image.outputs.image }}
          BACKEND_IMAGE: ${{ needs.build-backend-image.outputs.image }}
          AI_SERVICE_IMAGE: ${{ needs.build-ai-service-image.outputs.image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: FRONTEND_IMAGE,BACKEND_IMAGE,AI_SERVICE_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            cd /opt/conferencespace

            if [ ! -f .env.production ]; then
              echo ".env.production is missing on the server. Copy deployment/.env.production.example to /opt/conferencespace/.env.production, fill real values, then rerun deploy." >&2
              exit 1
            fi

            set_env() {
              key="$1"
              value="$2"
              tmp="$(mktemp)"
              if grep -q "^${key}=" .env.production; then
                awk -v key="${key}" -v value="${value}" '
                  BEGIN { prefix = key "=" }
                  index($0, prefix) == 1 { $0 = prefix value }
                  { print }
                ' .env.production > "${tmp}"
              else
                cp .env.production "${tmp}"
                printf "%s=%s\n" "${key}" "${value}" >> "${tmp}"
              fi
              cat "${tmp}" > .env.production
              rm -f "${tmp}"
            }

            old_app_images="$(docker compose --env-file .env.production -f docker-compose.prod.yml images -q web backend ai-service 2>/dev/null | sort -u || true)"

            chmod 600 .env.production
            set_env FRONTEND_IMAGE "${FRONTEND_IMAGE}"
            set_env BACKEND_IMAGE "${BACKEND_IMAGE}"
            set_env AI_SERVICE_IMAGE "${AI_SERVICE_IMAGE}"

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            docker compose --env-file .env.production -f docker-compose.prod.yml pull
            docker compose --env-file .env.production -f docker-compose.prod.yml run --rm backend-migrate
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans
            docker compose --env-file .env.production -f docker-compose.prod.yml ps
            if [ -n "${old_app_images}" ]; then
              current_app_images="$(docker compose --env-file .env.production -f docker-compose.prod.yml images -q web backend ai-service 2>/dev/null | sort -u || true)"
              old_app_images_file="$(mktemp)"
              current_app_images_file="$(mktemp)"
              printf "%s\n" "${old_app_images}" > "${old_app_images_file}"
              printf "%s\n" "${current_app_images}" > "${current_app_images_file}"
              stale_app_images="$(comm -23 "${old_app_images_file}" "${current_app_images_file}" || true)"
              rm -f "${old_app_images_file}" "${current_app_images_file}"
              if [ -n "${stale_app_images}" ]; then
                if ! echo "${stale_app_images}" | xargs -r docker image rm; then
                  echo "Some stale app images could not be removed; inspect Docker disk usage on the server." >&2
                fi
              fi
            fi
