name: conferencespace

services:
  frontend:
    image: caddy:2-alpine
    container_name: conferencespace-frontend
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - app
    restart: unless-stopped

  web:
    image: ${FRONTEND_IMAGE}
    container_name: conferencespace-web
    env_file:
      - path: ./.env.production
        required: false
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api/backend}
      BACKEND_API_BASE_URL: http://backend:8080
      AI_SERVICE_BASE_URL: http://ai-service:8090
    depends_on:
      backend:
        condition: service_started
    networks:
      - app
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    container_name: conferencespace-backend
    env_file:
      - path: ./.env.production
        required: false
    environment:
      SERVER_PORT: 8080
      SERVER_ENV: production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_SSLMODE: disable
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      AI_SERVICE_BASE_URL: http://ai-service:8090
      FILE_STORAGE_LOCAL_BASE_PATH: /data/uploads/submissions
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - app
      - data
    restart: unless-stopped

  backend-migrate:
    image: ${BACKEND_IMAGE}
    container_name: conferencespace-backend-migrate
    env_file:
      - path: ./.env.production
        required: false
    command:
      [
        "migrate",
        "-path",
        "/root/migrations",
        "-database",
        "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: "no"

  ai-service:
    image: ${AI_SERVICE_IMAGE}
    container_name: conferencespace-ai-service
    env_file:
      - path: ./.env.production
        required: false
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8090
      AI_SERVICE_ENV: production
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BACKEND_API_BASE_URL: http://backend:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - app
      - data
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: conferencespace-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: conferencespace-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15-community
    container_name: conferencespace-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - app
      - data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  uploads_data:

networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
