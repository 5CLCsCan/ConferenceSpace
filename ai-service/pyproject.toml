[tool.poetry]
name = "conference-ai-service"
version = "1.0.0"
description = "ConferenceSpace AI service v1 (no LangGraph)"
authors = ["ConferenceSpace Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
typing-extensions = "^4.12.2"
httpx = "^0.28.0"
orjson = "^3.10.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
redis = "^5.2.0"
alembic = "^1.14.0"
litellm = "^1.56.0"
pymupdf = "^1.24.0"
python-docx = "^1.1.2"
TexSoup = "^0.3.1"
python-magic = "^0.4.27"
rule-engine = "^4.5.3"
Jinja2 = "^3.1.6"
RapidFuzz = "^3.14.0"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
respx = "^0.21.1"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
