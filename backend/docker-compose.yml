services:
  postgres:
    image: postgres:15-alpine
    container_name: conferencespace-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conferencespace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - conferencespace-network

  redis:
    image: redis:7-alpine
    container_name: conferencespace-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - conferencespace-network

  neo4j:
    image: neo4j:5.15-community
    container_name: conferencespace-neo4j
    environment:
      NEO4J_AUTH: neo4j/conferencespace
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474" # HTTP - Neo4j Browser UI
      - "7687:7687" # Bolt - Database protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s # Increased to allow more time for Neo4j + APOC plugin to initialize
    restart: unless-stopped
    networks:
      - conferencespace-network

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: conferencespace-ai-service
    env_file:
      - ../ai-service/.env
    environment:
      REDIS_URL: "redis://redis:6379/0"
      POSTGRES_DSN: "postgresql+asyncpg://postgres:postgres@postgres:5432/conferencespace"
      BACKEND_API_BASE_URL: "http://host.docker.internal:8080"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - conferencespace-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conferencespace-api
    environment:
      SERVER_PORT: 8080
      SERVER_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: conferencespace
      DB_SSLMODE: disable
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: conferencespace
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - conferencespace-network
    restart: unless-stopped

  # Resource-constrained backend for benchmarking (2 CPU / 8 GB).
  # Only starts with the "bench" profile so it never runs during normal dev:
  #   docker compose --profile bench up -d --build app-bench
  # Exposes 8081 so it coexists with a bare `make dev` server on 8080.
  app-bench:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conferencespace-api-bench
    profiles: ["bench"]
    environment:
      SERVER_PORT: 8080
      SERVER_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: conferencespace
      DB_SSLMODE: disable
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: conferencespace
    ports:
      - "8081:8080"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 8g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - conferencespace-network
    restart: "no"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_plugins:
    driver: local

networks:
  conferencespace-network:
    driver: bridge
