services:
  postgres:
    image: postgres:15-alpine
    container_name: conferencespace-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conferencespace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - conferencespace-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conferencespace-api
    environment:
      SERVER_PORT: 8080
      SERVER_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: conferencespace
      DB_SSLMODE: disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - conferencespace-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  conferencespace-network:
    driver: bridge
